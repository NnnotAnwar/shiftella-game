[package]
name = "shiftella-game"
version = "0.2.3"
edition = "2024"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
ron = "0.10"
serde = { version = "1.0.229", features = ["derive"] }

# Build dependencies (macroquad, the audio decoder) optimized even in the dev profile:
# otherwise music loading and FPS in `cargo run` are much slower. Our own crate still builds fast.
[profile.dev.package."*"]
opt-level = 3

# miniquad 0.4.11 with a one-function fix for a stale texture-binding cache (black text after
# a font atlas regrows). See vendor/README.md.
[patch.crates-io]
miniquad = { path = "vendor/miniquad" }
